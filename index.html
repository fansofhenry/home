<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esperanza Dr — Home in Los Altos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f8f6f1;
      color: #3d3929;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Header ─── */
    header {
      background: linear-gradient(to right, #fffcf7, #fff);
      padding: 18px 36px;
      border-bottom: 1px solid #ebe8e1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 500;
      color: #2c2a22;
    }
    .header-left h1 span {
      font-weight: 400;
      font-style: italic;
      color: #9c9785;
    }
    .header-left p {
      margin-top: 1px;
      color: #b5ae9e;
      font-size: 0.78rem;
      letter-spacing: 0.3px;
    }
    .header-pills {
      display: flex;
      gap: 8px;
    }
    .header-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 15px;
      border-radius: 24px;
      font-size: 0.8rem;
      font-weight: 500;
      border: 1px solid #ebe8e1;
      background: #fff;
      color: #6b6656;
    }
    .header-pill.green {
      background: #f0faf0;
      border-color: #c6e6c6;
      color: #2d7a2d;
    }
    .header-pill .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4caf50;
      animation: softPulse 2.5s ease-in-out infinite;
    }
    @keyframes softPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ─── Hero landing page ─── */
    .hero {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 32px;
      cursor: pointer;
    }
    .hero img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      display: block;
      transition: transform 6s ease;
    }
    .hero:hover img { transform: scale(1.04); }
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(30,28,20,0.82) 0%, rgba(30,28,20,0.3) 50%, rgba(30,28,20,0.05) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 36px 40px;
    }
    .hero-overlay h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 500;
      color: #fff;
      margin-bottom: 6px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }
    .hero-overlay p {
      color: rgba(255,255,255,0.75);
      font-size: 0.95rem;
      max-width: 500px;
    }
    .hero-pills {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .hero-pill {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(255,255,255,0.15);
      color: #fff;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* Quick-nav cards on landing */
    .quick-nav {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 32px;
    }
    .qn-card {
      background: #fff;
      border: 1px solid #ebe8e1;
      border-radius: 14px;
      padding: 22px 20px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .qn-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(60,50,30,0.08);
      border-color: #d4cfc0;
    }
    .qn-card .qn-icon { font-size: 1.8rem; margin-bottom: 10px; display: block; }
    .qn-card h3 { font-size: 0.9rem; font-weight: 600; color: #3d3929; margin-bottom: 4px; }
    .qn-card p { font-size: 0.76rem; color: #9c9785; }

    /* Amenity row on landing */
    .amenity-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 32px;
    }
    .amenity {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      background: #fff;
      border: 1px solid #ebe8e1;
      border-radius: 24px;
      font-size: 0.82rem;
      color: #5c5647;
      font-weight: 500;
    }
    .amenity .am-icon { font-size: 1rem; }

    /* ─── Layout ─── */
    .container {
      display: flex;
      min-height: calc(100vh - 66px);
    }

    /* ─── Sidebar ─── */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: #fffcf7;
      border-right: 1px solid #ebe8e1;
      padding: 22px 0;
      overflow-y: auto;
      position: sticky;
      top: 66px;
      height: calc(100vh - 66px);
    }
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: #ddd8cd; border-radius: 3px; }
    .sb-label {
      padding: 0 22px 8px;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      color: #b5ae9e;
      font-weight: 700;
    }
    .sb-divider {
      height: 1px;
      background: #f0ede6;
      margin: 12px 22px;
    }
    .sb-btn {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 10px 22px;
      border: none;
      background: transparent;
      color: #7a7464;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      gap: 10px;
      border-left: 3px solid transparent;
    }
    .sb-btn:hover { background: #faf8f4; color: #3d3929; }
    .sb-btn.active {
      background: #f5f0e8;
      color: #5c4b28;
      border-left-color: #b8945a;
      font-weight: 500;
    }
    .sb-btn .sb-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px; height: 30px;
      border-radius: 8px;
      background: #f5f2ec;
      font-size: 0.78rem;
      font-weight: 600;
      flex-shrink: 0;
      color: #9c9785;
    }
    .sb-btn.active .sb-icon {
      background: #ede4d4;
      color: #7a6638;
    }
    .sb-btn .sb-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .sb-btn .sb-dot.open { background: #4caf50; }
    .sb-btn .sb-dot.taken { background: #ccc; }
    .sb-btn .sb-count {
      margin-left: auto;
      font-size: 0.7rem;
      color: #c4bfb2;
      font-weight: 500;
    }
    .sb-btn.dim { opacity: 0.42; }
    .sb-btn.dim:hover { opacity: 0.65; }

    /* ─── Main ─── */
    .main {
      flex: 1;
      padding: 32px 42px 60px;
      overflow-y: auto;
      max-width: 1100px;
    }

    /* Fade-in */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeUp 0.3s ease-out forwards; }

    /* ─── Page titles ─── */
    .pg-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 400;
      color: #2c2a22;
      margin-bottom: 4px;
    }
    .pg-sub {
      font-size: 0.88rem;
      color: #9c9785;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .pill {
      display: inline-block;
      padding: 3px 11px;
      border-radius: 16px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-right: 5px;
    }
    .pill-warm { background: #f5f0e8; color: #8a7245; }
    .pill-green { background: #edf7ed; color: #3a7a3a; }
    .pill-red { background: #fdf0ef; color: #b05050; }

    /* ─── Legend ─── */
    .legend {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 26px;
      padding: 11px 16px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #ebe8e1;
      font-size: 0.82rem;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; color: #7a7464; }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; }
    .legend-dot.g { background: #4caf50; }
    .legend-dot.r { background: #ccc; }
    .legend .lg-count { margin-left: auto; color: #b5ae9e; font-weight: 500; }

    /* ─── Section headings ─── */
    .sec-head {
      font-size: 1rem;
      font-weight: 600;
      color: #3d3929;
      margin-bottom: 14px;
      padding-bottom: 9px;
      border-bottom: 1px solid #f0ede6;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sec-head .si { font-size: 1.1rem; }

    /* ─── Photo grid ─── */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .photo-card {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #eee;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      aspect-ratio: 4/3;
    }
    .photo-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(60,50,30,0.12);
    }
    .photo-card img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .photo-card:hover img { transform: scale(1.04); }
    .photo-card .overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 24px 13px 10px;
      background: linear-gradient(transparent, rgba(30,28,20,0.7));
      font-size: 0.78rem;
      color: #fff;
      font-weight: 500;
    }

    /* ─── Room sections ─── */
    .room-sec { margin-bottom: 34px; }
    .room-sec-head {
      font-size: 0.92rem;
      font-weight: 500;
      color: #6b6656;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #f0ede6;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .room-sec-head .rs-count {
      margin-left: auto;
      font-size: 0.72rem;
      color: #c4bfb2;
    }
    .room-sec.dim .photo-grid { opacity: 0.3; transition: opacity 0.25s; }
    .room-sec.dim:hover .photo-grid { opacity: 0.6; }

    /* ─── Welcome banner ─── */
    .welcome-banner {
      background: linear-gradient(135deg, #f7f3ec, #eee8dd);
      border-radius: 16px;
      padding: 30px 34px;
      margin-bottom: 28px;
      border: 1px solid #e6dfd2;
    }
    .welcome-banner h3 {
      font-family: 'Playfair Display', serif;
      color: #3d3929;
      font-weight: 400;
      font-size: 1.15rem;
      margin-bottom: 6px;
    }
    .welcome-banner p {
      color: #7a7464;
      font-size: 0.88rem;
      line-height: 1.65;
    }

    /* ─── Host section ─── */
    .host-section {
      background: #fff;
      border: 1px solid #ebe8e1;
      border-radius: 18px;
      padding: 34px;
      margin-bottom: 28px;
    }
    .host-top {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    .host-avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d4c4a0, #b8945a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #fff;
      flex-shrink: 0;
    }
    .host-info h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      color: #2c2a22;
      font-weight: 400;
    }
    .host-info p {
      color: #9c9785;
      font-size: 0.85rem;
      margin-top: 2px;
    }
    .host-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .host-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #f5f0e8;
      color: #8a7245;
    }
    .host-body { line-height: 1.75; }
    .host-body p {
      color: #5c5647;
      font-size: 0.9rem;
      margin-bottom: 14px;
    }
    .host-highlights {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    .host-hl {
      background: #faf8f4;
      border: 1px solid #f0ede6;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .host-hl .hl-icon {
      font-size: 1.4rem;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .host-hl h4 {
      font-size: 0.85rem;
      color: #3d3929;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .host-hl p {
      font-size: 0.8rem;
      color: #9c9785;
      line-height: 1.5;
      margin-bottom: 0;
    }

    /* ─── Lightbox ─── */
    .lightbox {
      display: none;
      position: fixed; inset: 0;
      z-index: 1000;
      background: rgba(44,42,34,0.92);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 90vw; max-height: 82vh;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      animation: fadeUp 0.2s ease-out;
    }
    .lightbox .lb-caption { margin-top: 14px; color: #d4cfc3; font-size: 0.88rem; }
    .lightbox .lb-close {
      position: absolute; top: 16px; right: 24px;
      background: rgba(255,255,255,0.12); border: none;
      color: #e8e3d8; font-size: 1.5rem;
      width: 42px; height: 42px; border-radius: 50%;
      cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
      z-index: 1001;
    }
    .lightbox .lb-close:hover { background: rgba(255,255,255,0.25); }
    .lightbox .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.12); border: none;
      color: #e8e3d8; font-size: 1.5rem;
      width: 48px; height: 48px; border-radius: 50%;
      cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .lightbox .lb-nav:hover { background: rgba(255,255,255,0.25); }
    .lightbox .lb-prev { left: 20px; }
    .lightbox .lb-next { right: 20px; }
    .lightbox .lb-counter {
      position: absolute; bottom: 20px;
      color: rgba(255,255,255,0.4); font-size: 0.82rem; font-weight: 500;
    }

    /* ─── Neighborhood ─── */
    .nbr-hero {
      background: linear-gradient(135deg, #eef5ec, #f4f1e8);
      border-radius: 16px;
      padding: 34px;
      margin-bottom: 28px;
      border: 1px solid #dce8d8;
    }
    .nbr-hero h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem; font-weight: 400; color: #2c2a22; margin-bottom: 8px;
    }
    .nbr-hero p { color: #6b7e62; font-size: 0.9rem; line-height: 1.7; }
    .nbr-hero .loc-pill {
      display: inline-block; margin-top: 12px;
      padding: 5px 13px; background: rgba(76,175,80,0.1);
      color: #3a7a3a; border-radius: 16px;
      font-size: 0.78rem; font-weight: 600; margin-right: 6px;
    }

    .place-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px; margin-bottom: 34px;
    }
    .place-card {
      background: #fff;
      border: 1px solid #ebe8e1;
      border-radius: 14px; padding: 22px;
      transition: transform 0.2s ease, box-shadow 0.2s;
    }
    .place-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(60,50,30,0.08); }
    .place-card .pc-icon { font-size: 1.6rem; margin-bottom: 10px; display: block; }
    .place-card h3 { font-size: 0.95rem; font-weight: 600; color: #3d3929; margin-bottom: 4px; }
    .place-card .pc-dist {
      font-size: 0.72rem; color: #6b8f3a; margin-bottom: 8px;
      display: inline-block; background: #f0f7ec;
      padding: 3px 9px; border-radius: 8px; font-weight: 600;
    }
    .place-card p { font-size: 0.84rem; color: #7a7464; line-height: 1.6; }
    .place-card .pc-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .place-card .pc-tag {
      font-size: 0.67rem; padding: 3px 8px; border-radius: 6px;
      background: #f5f2ec; color: #9c9785; font-weight: 600;
    }

    .bike-routes { display: grid; gap: 10px; margin-bottom: 34px; }
    .route-card {
      background: #fff;
      border: 1px solid #ebe8e1;
      border-radius: 12px; padding: 16px 20px;
      display: flex; align-items: center; gap: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .route-card:hover { transform: translateX(3px); box-shadow: 0 4px 16px rgba(60,50,30,0.06); }
    .rt-icon { font-size: 1.4rem; flex-shrink: 0; }
    .rt-info h4 { color: #3d3929; font-weight: 600; font-size: 0.88rem; margin-bottom: 2px; }
    .rt-info p { color: #9c9785; font-size: 0.8rem; line-height: 1.5; }
    .rt-meta { margin-left: auto; text-align: right; flex-shrink: 0; }
    .rt-meta .rt-dist { font-size: 1rem; color: #6b8f3a; font-weight: 700; }
    .rt-meta .rt-time { font-size: 0.7rem; color: #b5ae9e; margin-top: 1px; }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px; margin-bottom: 34px;
    }
    .shop-chip {
      background: #fff;
      border: 1px solid #ebe8e1;
      border-radius: 10px; padding: 14px 10px;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .shop-chip:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(60,50,30,0.06); }
    .shop-chip .sc-icon { font-size: 1.3rem; display: block; margin-bottom: 6px; }
    .shop-chip .sc-name { font-size: 0.8rem; color: #3d3929; font-weight: 600; }
    .shop-chip .sc-type { font-size: 0.68rem; color: #b5ae9e; margin-top: 2px; }

    .callout {
      border-radius: 14px; padding: 20px 24px; margin-bottom: 22px;
    }
    .callout.sage {
      background: linear-gradient(135deg, #f0f5ed, #f5f2ec);
      border: 1px solid #dce8d8;
    }
    .callout.warm {
      background: linear-gradient(135deg, #f8f3eb, #f5f0e8);
      border: 1px solid #e6dfd2;
    }
    .callout h4 {
      font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 6px; font-weight: 700;
    }
    .callout.sage h4 { color: #5a7a4a; }
    .callout.warm h4 { color: #8a7245; }
    .callout p { color: #6b6656; font-size: 0.86rem; line-height: 1.65; }

    /* ─── Mobile ─── */
    .menu-toggle {
      display: none;
      position: fixed; bottom: 20px; right: 20px; z-index: 500;
      width: 50px; height: 50px; border-radius: 14px;
      background: #b8945a; border: none;
      color: #fff; font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(184,148,90,0.35);
    }
    @media (max-width: 768px) {
      .sidebar {
        position: fixed; left: -260px; top: 0;
        height: 100vh; z-index: 400;
        transition: left 0.3s ease; padding-top: 66px;
      }
      .sidebar.open { left: 0; }
      .menu-toggle { display: flex; align-items: center; justify-content: center; }
      .main { padding: 20px 18px; }
      .photo-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
      header { padding: 14px 18px; }
      .header-left h1 { font-size: 1.15rem; }
      .header-pills { display: none; }
      .place-grid { grid-template-columns: 1fr; }
      .shop-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
      .nbr-hero, .welcome-banner, .host-section { padding: 22px; }
      .route-card { flex-direction: column; text-align: center; gap: 10px; }
      .rt-meta { margin-left: 0; text-align: center; }
      .host-top { flex-direction: column; text-align: center; }
      .host-highlights { grid-template-columns: 1fr; }

<script>
  // ─── Data ───
  const homePhotos = {

  const rooms = [

      photos:["Room6_foto1.JPG","Room6_foto2.JPG","Room6_foto3.JPG","Room6_foto4.JPG","Room6_foto5.JPG"] },

  const availableRooms = new Set([2, 5, 7, 9]);
  const TOTAL_ROOMS = rooms.length;
  const availCount = rooms.filter(r => availableRooms.has(r.id)).length;

  let lightboxPhotos = [], lightboxIndex = 0;

  // ─── Sidebar buttons ───
  const btnBox = document.getElementById('room-buttons');
  rooms.forEach(room => {
    const avail = availableRooms.has(room.id);
    const btn = document.createElement('button');
    btn.className = 'sb-btn' + (avail ? '' : ' dim');
    btn.dataset.room = room.id;
    btn.onclick = () => showRoom(room.id);
    btn.innerHTML = `
      <span class="sb-icon">${room.id}</span>
      ${room.name}
      <span class="sb-dot ${avail ? 'open' : 'taken'}"></span>
      <span class="sb-count">${room.photos.length}</span>

    btnBox.appendChild(btn);

  // ─── Helpers ───
  function pp(folder, photo) { return encodeURI(folder + '/' + photo); }
  function cn(n) {
    return n.replace(/\.(jpg|jpeg|png|gif|webp)$/i,'').replace(/[_-]/g,' ')
      .replace(/\s*\(\d+\)\s*/g,' ').replace(/IMG \d+/i,'Photo').replace(/Appraisal$/i,'').trim();
  }
  function peekGrid() {
    const picks = [6,2,7,8,4,1]; // indices into homePhotos.photos
    return picks.map(idx => {
      const p = homePhotos.photos[idx];
      return `<div class="photo-card" onclick="openLightbox(0,${idx})">
        <img src="${pp(homePhotos.folder,p)}" alt="${cn(p)}" loading="lazy">
        <div class="overlay">${cn(p)}</div>
      </div>`;
    }).join('');
  }
  function grid(data, rid) {
    return data.photos.map((p,i) => `
      <div class="photo-card" onclick="openLightbox(${rid},${i})">
        <img src="${pp(data.folder,p)}" alt="${cn(p)}" loading="lazy">
        <div class="overlay">${cn(p)}</div>
      </div>`).join('');
  }

  // ─── Render ───
  function showRoom(id) {
    document.querySelectorAll('.sb-btn').forEach(b => b.classList.toggle('active', b.dataset.room == id));

    let h = '';

    if (id === 'welcome') {
      h = `<div class="fade-in">

          <div class="hero-overlay">

            <div class="hero-pills">
              <span class="hero-pill">Los Altos, California</span>
              <span class="hero-pill">${availCount} rooms available</span>
              <span class="hero-pill">1 mi to downtown</span>

        <div class="amenity-row">

          <div class="amenity"><span class="am-icon">&#128087;</span> Laundry</div>
          <div class="amenity"><span class="am-icon">&#128663;</span> Parking</div>
          <div class="amenity"><span class="am-icon">&#128246;</span> WiFi</div>
          <div class="amenity"><span class="am-icon">&#128075;</span> On-site Host</div>
          <div class="amenity"><span class="am-icon">&#127795;</span> Quiet Neighborhood</div>
        </div>

        <div class="quick-nav">
          <div class="qn-card" onclick="showRoom('all')">
            <span class="qn-icon">&#128209;</span>
            <h3>Browse Rooms</h3>
            <p>${availCount} of ${TOTAL_ROOMS} available</p>
          </div>
          <div class="qn-card" onclick="showRoom('home')">
            <span class="qn-icon">&#127968;</span>
            <h3>Property Photos</h3>
            <p>Kitchen, pool, patio &amp; more</p>
          </div>
          <div class="qn-card" onclick="showRoom('neighborhood')">
            <span class="qn-icon">&#127795;</span>

    else if (id === 'home') {

  }

  // ─── Lightbox ───
  function openLightbox(rid, idx) {
    const d = rid === 0 ? homePhotos : rooms.find(r => r.id === rid);
    lightboxPhotos = d.photos.map(p => ({ src: pp(d.folder,p), caption: `${d.name} \u2014 ${cn(p)}` }));
    lightboxIndex = idx;
    updateLightbox();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }
  function navigateLightbox(dir) {
    lightboxIndex = (lightboxIndex + dir + lightboxPhotos.length) % lightboxPhotos.length;
    updateLightbox();
  }
  function updateLightbox() {
    const item = lightboxPhotos[lightboxIndex];
    document.getElementById('lb-img').src = item.src;
    document.getElementById('lb-caption').textContent = item.caption;
    document.getElementById('lb-counter').textContent = `${lightboxIndex+1} / ${lightboxPhotos.length}`;
  }
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key==='Escape') closeLightbox();
    if (e.key==='ArrowLeft') navigateLightbox(-1);
    if (e.key==='ArrowRight') navigateLightbox(1);
  });
  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target.id==='lightbox') closeLightbox();
  });
  function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

  // ─── Init ───
  showRoom('welcome');
</script>
